<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ryde Panthers - iPad Sub Manager</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-status-bar-style" content="black-translucent">
    <link class="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/5323/5323814.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        body { font-family: 'Inter', sans-serif; touch-action: pan-y; -webkit-user-select: none; user-select: none; overflow: hidden; height: 100vh; background-color: #020617; color: #f8fafc; }
        .player-chip { touch-action: none; cursor: grab; }
        .drop-zone { min-height: 40px; height: 100%; }
        .view-container { height: calc(100vh - 120px); overflow-y: auto; padding-bottom: 20px; }
        .switch { position: relative; display: inline-block; width: 34px; height: 20px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #1e293b; transition: .4s; border-radius: 20px; }
        .slider:before { position: absolute; content: ""; height: 14px; width: 14px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: #3b82f6; }
        input:checked + .slider:before { transform: translateX(14px); }
    </style>
</head>
<body>

    <div id="app" class="max-w-md mx-auto px-4 pt-3 h-screen flex flex-col">
        <header class="flex justify-between items-center mb-3 bg-slate-900/60 p-3 rounded-2xl border border-slate-800">
            <div>
                <span class="text-[8px] font-black uppercase text-blue-500">TEAM MANAGER</span>
                <h1 id="headerTitle" class="text-base font-extrabold text-white">Ryde Panthers</h1>
            </div>
            <div id="liveScoreboard" class="hidden flex items-center gap-3 bg-slate-950 px-4 py-1.5 rounded-xl border border-slate-800">
                <button onclick="adjustScore('home', -1)" class="w-5 h-5 bg-slate-800 rounded text-xs">-</button>
                <span id="scoreHome" class="text-sm font-black text-blue-400">0</span>
                <button onclick="adjustScore('home', 1)" class="w-5 h-5 bg-slate-800 rounded text-xs">+</button>
                <span class="text-[10px] font-black text-slate-600">VS</span>
                <button onclick="adjustScore('away', -1)" class="w-5 h-5 bg-slate-800 rounded text-xs">-</button>
                <span id="scoreAway" class="text-sm font-black text-red-400">0</span>
                <button onclick="adjustScore('away', 1)" class="w-5 h-5 bg-slate-800 rounded text-xs">+</button>
            </div>
        </header>

        <div id="setupView" class="view-container">
            <div class="bg-slate-900 rounded-2xl p-3 border border-slate-800">
                <h2 class="text-sm font-bold mb-2">Match Settings</h2>
                <div class="space-y-2">
                    <input type="text" id="teamName" value="Ryde Panthers" class="w-full bg-slate-800 p-2 rounded-xl text-sm font-bold">
                    <div class="grid grid-cols-2 gap-2">
                        <input type="number" id="activePlayers" value="4" class="bg-slate-800 p-2 rounded-xl text-sm font-bold" placeholder="Field Players">
                        <input type="number" id="halfTime" value="20" class="bg-slate-800 p-2 rounded-xl text-sm font-bold" placeholder="Mins/Half">
                    </div>
                    <textarea id="playerNames" class="w-full p-2 bg-slate-800 rounded-xl h-20 text-[11px]">Emmanuel, Izza, Amos, Riley, Yan, Jessica, Noah</textarea>
                    <button onclick="confirmPlan()" class="w-full bg-blue-600 text-white font-black py-3 rounded-xl uppercase text-xs">Start Match</button>
                </div>
            </div>
        </div>

        <div id="fieldView" class="hidden view-container pb-24">
            <div class="grid grid-cols-2 gap-2 mb-2">
                <div class="bg-slate-900 p-2 rounded-xl border border-slate-800 text-center">
                    <div class="text-[7px] text-slate-500 font-bold uppercase">Time Left</div>
                    <div id="halfTimerDisplay" class="text-xl font-black">20:00</div>
                </div>
                <div id="subTimerContainer" class="bg-slate-900 p-2 rounded-xl border border-slate-800 text-center">
                    <div class="text-[7px] text-slate-500 font-bold uppercase">Next Sub</div>
                    <div id="subTimerDisplay" class="text-xl font-black">05:00</div>
                </div>
            </div>
            
            <div class="grid grid-cols-4 gap-1.5 mb-2 h-10">
                <button id="startBtn" onclick="toggleTimer()" class="bg-blue-600 text-white rounded-xl font-black text-[9px] uppercase">Start</button>
                <button onclick="nextRotation()" class="bg-slate-800 text-slate-300 rounded-xl font-black text-[9px] uppercase">Rotate</button>
                <button onclick="pauseForHalfTime()" class="bg-red-900/40 text-red-400 rounded-xl font-black text-[9px] uppercase">End Half</button>
                <button onclick="resetTimer()" class="bg-slate-800/40 text-slate-400 rounded-xl font-black text-[9px] uppercase">Reset</button>
            </div>

            <div class="grid grid-cols-2 gap-2 h-full">
                <div class="bg-slate-900/80 p-2 rounded-xl border border-slate-800 overflow-y-auto">
                    <h3 class="text-slate-500 font-black text-[8px] uppercase mb-2">Field</h3>
                    <div id="onFieldList" class="drop-zone flex flex-col gap-1"></div>
                </div>
                <div class="flex flex-col gap-2">
                    <div id="goalieSection" class="bg-blue-950/20 p-2 rounded-xl border border-blue-900/30">
                        <h3 class="text-blue-400 font-black text-[8px] uppercase">Goalie</h3>
                        <div id="goalieList" class="drop-zone h-8"></div>
                    </div>
                    <div class="bg-slate-900/80 p-2 rounded-xl border border-slate-800 overflow-y-auto flex-1">
                        <h3 class="text-orange-400 font-black text-[8px] uppercase">Bench</h3>
                        <div id="subsList" class="drop-zone flex flex-col gap-1"></div>
                    </div>
                    <div id="injurySection" class="bg-red-950/20 p-2 rounded-xl border border-red-900/30 h-20">
                        <h3 class="text-red-400 font-black text-[8px] uppercase">Injured/Out</h3>
                        <div id="injuredList" class="drop-zone flex flex-wrap gap-1"></div>
                    </div>
                </div>
            </div>
        </div>

        <nav id="bottomNav" class="fixed bottom-0 left-0 right-0 bg-slate-950 p-3 border-t border-slate-800 flex justify-around hidden">
            <button onclick="showView('field')" class="text-blue-500 font-bold text-xs uppercase">Field</button>
            <button onclick="showView('stats')" class="text-slate-500 font-bold text-xs uppercase">Stats</button>
        </nav>
    </div>

    <script>
        let game = {
            isRunning: false, halfSecondsRemaining: 1200, subSecondsRemaining: 300, 
            playerTimeElapsed: {}, currentShift: { onField: [], subs: [], goalie: null },
            injuredPlayers: [], activeCount: 4, timerId: null
        };

        function showView(viewId) {
            document.getElementById('setupView').classList.add('hidden');
            document.getElementById('fieldView').classList.add('hidden');
            document.getElementById(viewId + 'View').classList.remove('hidden');
        }

        function toggleTimer() {
            if (game.isRunning) {
                clearInterval(game.timerId); game.isRunning = false;
            } else {
                game.isRunning = true;
                game.timerId = setInterval(() => {
                    game.halfSecondsRemaining--;
                    game.subSecondsRemaining--;
                    if (game.subSecondsRemaining <= 0) {
                        game.subSecondsRemaining = 300;
                        if ('vibrate' in navigator) navigator.vibrate(500);
                    }
                    document.getElementById('halfTimerDisplay').innerText = Math.floor(game.halfSecondsRemaining/60) + ":" + (game.halfSecondsRemaining%60).toString().padStart(2,'0');
                    document.getElementById('subTimerDisplay').innerText = Math.floor(game.subSecondsRemaining/60) + ":" + (game.subSecondsRemaining%60).toString().padStart(2,'0');
                }, 1000);
            }
        }

        function confirmPlan() {
            document.getElementById('bottomNav').classList.remove('hidden');
            showView('field');
        }

        function resetTimer() { location.reload(); }
        window.onload = () => showView('setup');
    </script>
</body>
</html>
